name: Build Noor Al-Quran APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: noor_al_quran
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Commit and Push APK to Repository
        run: |
          mkdir -p releases
          cp build/app/outputs/flutter-apk/app-release.apk releases/app-release-${{ github.run_number }}.apk
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add releases/
          git commit -m "Build #${{ github.run_number }}: Add APK release" || echo "No changes to commit"
          git push
