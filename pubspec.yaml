name: noor_al_quran
description: Islamic Qur'an Application with Audio, Translations, and Features
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.0
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Audio
  just_audio: ^0.9.31
  audio_session: ^0.1.16
  flutter_sound: ^9.2.13

  # Database
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1

  # Firebase
  firebase_core: ^2.24.2
  firebase_storage: ^11.5.6
  cloud_firestore: ^4.14.0
  firebase_auth: ^4.16.0

  # UI
  flutter_svg: ^2.0.7
  google_fonts: ^4.0.4
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.19.0
  get: ^4.6.5
  dio: ^5.3.1
  connectivity_plus: ^5.0.1
  shared_preferences: ^2.2.2
  permission_handler: ^11.3.1
  geolocator: ^9.0.2

  # Search & Analytics
  algolia: ^1.1.2
  firebase_analytics: ^10.7.0

  # Notifications
  flutter_local_notifications: ^16.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  
  assets:
    - assets/quran/
    - assets/audio/
    - assets/images/
    - assets/icons/
    - assets/translations/
    - assets/data/
  
  fonts:
    - family: ArabicFont
      fonts:
        - asset: assets/fonts/ArabicFont.ttf
    - family: EnglishFont
      fonts:
        - asset: assets/fonts/EnglishFont.ttf
